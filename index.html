<!doctype html><html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151617"><title>STAC — Streamer Activity</title><link rel="stylesheet" href="./style.css"></head>
<body>
<div id="authScreen" class="auth-screen"><div class="auth-card"><b>STAC</b><small>STREAMER ACTIVITY</small><h1>ストリーマーの活動を、ひとつに。</h1>
<input id="authId" placeholder="ID" autocomplete="username"><input id="authPassword" type="password" placeholder="パスワード" autocomplete="current-password">
<div><button id="loginButton">ログイン</button><button id="signupButton">新規登録</button></div><p id="authMessage"></p></div></div>
<div id="app" class="hidden"><aside id="sidebar"><div class="logo">STAC <button id="sidebarToggle">☰</button></div>
<nav><button data-view="home">⌂ ホーム</button><button data-view="live">● 配信中</button><button data-view="upcoming">◷ 配信予定</button><button data-view="latest">▤ 最新情報</button><button data-view="streamers">＋ ストリーマー</button><button data-view="settings">⚙ 設定</button></nav>
<div class="user"><span id="userMark">S</span><span id="userName">---</span><button id="logoutButton">ログアウト</button></div></aside>
<main><header><button id="mobileMenu">☰</button><span>Streamer Activity</span><small id="lastSync">同期確認中…</small></header><div class="content">
<section id="homeView" class="view active"><div class="head"><small>STAC</small><h1>ホーム</h1><p>登録したストリーマーの現在の活動。</p></div><h2>配信中</h2><div id="liveList" class="grid"></div><h2>配信予定</h2><div id="upcomingList"></div><h2>最新情報</h2><div id="latestList"></div></section>
<section id="liveView" class="view"><div class="head"><small>LIVE</small><h1>配信中</h1><p>現在ライブ配信中の登録チャンネル。</p></div><div id="livePageList" class="grid"></div></section>
<section id="upcomingView" class="view"><div class="head"><small>UPCOMING</small><h1>配信予定</h1></div><div id="upcomingPageList"></div></section>
<section id="latestView" class="view"><div class="head"><small>LATEST</small><h1>最新情報</h1></div><div id="latestPageList"></div></section>
<section id="streamersView" class="view"><div class="head"><small>STREAMERS</small><h1>ストリーマー</h1><p>STACで追いかけるストリーマー。</p></div>
<div class="panel"><h3>登録中</h3><div id="myStreamers">読み込み中…</div></div>
<div class="panel"><h3>ストリーマーを追加</h3><div class="add"><input id="streamerUrl" placeholder="YouTubeチャンネルURL / @ハンドル"><button id="addStreamerButton">追加</button><p id="addStreamerMessage"></p></div></div></section>
<section id="settingsView" class="view"><div class="head"><small>SETTINGS</small><h1>設定</h1></div><div class="panel">ユーザーID：<strong id="settingsUserId">---</strong></div></section>
</div></main></div>
<script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js"></script>
</body></html>
