<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>STAC Display</title>

  <link rel="stylesheet" href="display.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>

<body>

  <div class="display-app">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="display-header">

      <div class="brand">
        <div class="brand-main">スト活</div>
        <div class="brand-sub">STREAMER ACTIVITY</div>
      </div>

      <div class="header-right">
        <div id="display-date" class="display-date">----/--/--</div>
        <div id="display-clock" class="display-clock">--:--</div>
      </div>

    </header>


    <!-- =========================
         MAIN
    ========================== -->
    <main class="display-main">

      <!-- =========================
           LIVE
      ========================== -->
      <section class="live-section">

        <div class="section-heading">
          <div>
            <div class="section-label">NOW LIVE</div>
            <h1>配信中</h1>
          </div>

          <div id="live-count" class="section-count">
            0
          </div>
        </div>

        <div id="live-list" class="live-list">

          <div class="empty-state">
            <div class="empty-title">現在配信中の配信はありません</div>
            <div class="empty-sub">
              次の配信を待っています
            </div>
          </div>

        </div>

      </section>


      <!-- =========================
           UPCOMING
      ========================== -->
      <section class="upcoming-section">

        <div class="section-heading compact">

          <div>
            <div class="section-label">UP NEXT</div>
            <h2>配信予定</h2>
          </div>

        </div>

        <div id="upcoming-list" class="upcoming-list">

          <div class="empty-state small">
            <div class="empty-title">配信予定はありません</div>
          </div>

        </div>

      </section>


      <!-- =========================
           LATEST
      ========================== -->
      <section class="latest-section">

        <div class="section-heading compact">

          <div>
            <div class="section-label">LATEST</div>
            <h2>最新情報</h2>
          </div>

        </div>

        <div id="latest-list" class="latest-list">

          <div class="empty-state small">
            <div class="empty-title">最新情報を読み込んでいます…</div>
          </div>

        </div>

      </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="display-footer">

      <div class="footer-status">
        <span class="status-dot"></span>
        <span id="sync-status">STAC ONLINE</span>
      </div>

      <div class="footer-right">
        <span>自動更新</span>
        <span id="last-updated">--:--</span>
      </div>

    </footer>

  </div>


  <!-- =========================
       DISPLAY SCRIPT
  ========================== -->
  <script>

    const supabaseClient = window.supabase.createClient(
      window.STAC_CONFIG.SUPABASE_URL,
      window.STAC_CONFIG.SUPABASE_PUBLISHABLE_KEY
    );


    /* ========================================
       Utility
    ======================================== */

    function escapeHtml(value) {
      if (value == null) return "";

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function formatTime(value) {

      if (!value) return "--:--";

      const date = new Date(value);

      return date.toLocaleTimeString("ja-JP", {
        hour: "2-digit",
        minute: "2-digit"
      });

    }


    function formatDate(value) {

      if (!value) return "";

      const date = new Date(value);

      return date.toLocaleDateString("ja-JP", {
        month: "numeric",
        day: "numeric",
        weekday: "short"
      });

    }


    function getThumbnail(video) {

      if (video.thumbnail) {
        return video.thumbnail;
      }

      if (video.video_id) {
        return `https://i.ytimg.com/vi/${video.video_id}/hqdefault.jpg`;
      }

      return "";
    }


    /* ========================================
       Clock
    ======================================== */

    function updateClock() {

      const now = new Date();

      document.getElementById("display-clock").textContent =
        now.toLocaleTimeString("ja-JP", {
          hour: "2-digit",
          minute: "2-digit"
        });

      document.getElementById("display-date").textContent =
        now.toLocaleDateString("ja-JP", {
          year: "numeric",
          month: "numeric",
          day: "numeric",
          weekday: "short"
        });

    }

    updateClock();

    setInterval(updateClock, 1000);


    /* ========================================
       Load data
    ======================================== */

    async function loadDisplayData() {

      try {

        const { data: streamers, error: streamerError } =
          await supabaseClient
            .from("streamers")
            .select("*")
            .eq("enabled", true)
            .order("name");

        if (streamerError) {
          throw streamerError;
        }


        const streamerIds =
          (streamers || []).map(streamer => streamer.id);


        if (streamerIds.length === 0) {

          renderEverything([], [], []);

          return;
        }


        const { data: videos, error: videoError } =
          await supabaseClient
            .from("videos")
            .select("*")
            .in("streamer_id", streamerIds)
            .order("scheduled_at", {
              ascending: true,
              nullsFirst: false
            });

        if (videoError) {
          throw videoError;
        }


        const now = Date.now();


        const live = (videos || []).filter(video => {

          return video.status === "live";

        });


        const upcoming = (videos || [])
          .filter(video => {

            if (video.status !== "upcoming") {
              return false;
            }

            if (!video.scheduled_at) {
              return false;
            }

            return new Date(video.scheduled_at).getTime() >= now;

          })
          .sort((a, b) => {

            return new Date(a.scheduled_at) -
              new Date(b.scheduled_at);

          })
          .slice(0, 6);


        const latest = (videos || [])
          .filter(video => {

            return (
              video.status === "video" ||
              video.status === "archive"
            );

          })
          .sort((a, b) => {

            return new Date(
              b.published_at || b.created_at
            ) -
            new Date(
              a.published_at || a.created_at
            );

          })
          .slice(0, 6);


        renderEverything(
          live,
          upcoming,
          latest
        );


        document.getElementById("sync-status")
          .textContent = "STAC ONLINE";

        document.getElementById("last-updated")
          .textContent = formatTime(new Date());


      } catch (error) {

        console.error("STAC Display error:", error);

        document.getElementById("sync-status")
          .textContent = "SYNC ERROR";

      }

    }


    /* ========================================
       Render
    ======================================== */

    function renderEverything(
      live,
      upcoming,
      latest
    ) {

      renderLive(live);
      renderUpcoming(upcoming);
      renderLatest(latest);

    }


    /* ========================================
       Live
    ======================================== */

    function renderLive(live) {

      const container =
        document.getElementById("live-list");

      const count =
        document.getElementById("live-count");


      count.textContent = live.length;


      if (!live.length) {

        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">
              現在配信中の配信はありません
            </div>
            <div class="empty-sub">
              次の配信を待っています
            </div>
          </div>
        `;

        return;
      }


      container.innerHTML =
        live.map(video => {

          const thumbnail =
            getThumbnail(video);

          return `
            <a
              class="live-card"
              href="${escapeHtml(video.url || "#")}"
              target="_blank"
              rel="noopener"
            >

              <div class="live-thumbnail">

                ${
                  thumbnail
                    ? `<img
                        src="${escapeHtml(thumbnail)}"
                        alt=""
                        loading="lazy"
                      >`
                    : ""
                }

                <div class="live-overlay">

                  <span class="live-badge">
                    LIVE
                  </span>

                </div>

              </div>


              <div class="live-info">

                <div class="streamer-name">
                  ${escapeHtml(video.streamer_name)}
                </div>

                <div class="live-title">
                  ${escapeHtml(video.title)}
                </div>

              </div>

            </a>
          `;

        }).join("");

    }


    /* ========================================
       Upcoming
    ======================================== */

    function renderUpcoming(upcoming) {

      const container =
        document.getElementById("upcoming-list");


      if (!upcoming.length) {

        container.innerHTML = `
          <div class="empty-state small">
            <div class="empty-title">
              配信予定はありません
            </div>
          </div>
        `;

        return;
      }


      container.innerHTML =
        upcoming.map(video => {

          return `
            <a
              class="upcoming-card"
              href="${escapeHtml(video.url || "#")}"
              target="_blank"
              rel="noopener"
            >

              <div class="upcoming-time">

                <div class="upcoming-date">
                  ${escapeHtml(
                    formatDate(video.scheduled_at)
                  )}
                </div>

                <div class="upcoming-clock">
                  ${escapeHtml(
                    formatTime(video.scheduled_at)
                  )}
                </div>

              </div>


              <div class="upcoming-line"></div>


              <div class="upcoming-info">

                <div class="streamer-name">
                  ${escapeHtml(video.streamer_name)}
                </div>

                <div class="upcoming-title">
                  ${escapeHtml(video.title)}
                </div>

              </div>

            </a>
          `;

        }).join("");

    }


    /* ========================================
       Latest
    ======================================== */

    function renderLatest(latest) {

      const container =
        document.getElementById("latest-list");


      if (!latest.length) {

        container.innerHTML = `
          <div class="empty-state small">
            <div class="empty-title">
              最新情報はありません
            </div>
          </div>
        `;

        return;
      }


      container.innerHTML =
        latest.map(video => {

          const thumbnail =
            getThumbnail(video);


          return `
            <a
              class="latest-card"
              href="${escapeHtml(video.url || "#")}"
              target="_blank"
              rel="noopener"
            >

              <div class="latest-thumbnail">

                ${
                  thumbnail
                    ? `<img
                        src="${escapeHtml(thumbnail)}"
                        alt=""
                        loading="lazy"
                      >`
                    : ""
                }

              </div>


              <div class="latest-info">

                <div class="streamer-name">
                  ${escapeHtml(video.streamer_name)}
                </div>

                <div class="latest-title">
                  ${escapeHtml(video.title)}
                </div>

                <div class="latest-date">
                  ${
                    formatDate(
                      video.published_at ||
                      video.created_at
                    )
                  }
                </div>

              </div>

            </a>
          `;

        }).join("");

    }


    /* ========================================
       Start
    ======================================== */

    loadDisplayData();


    /*
      iPad用なので1分ごとに更新。
      GitHub Actions側のYouTube同期も
      5分おきなので、このくらいで十分。
    */

    setInterval(
      loadDisplayData,
      60 * 1000
    );

  </script>

</body>
</html>
