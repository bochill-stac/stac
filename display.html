<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111214">
  <title>スト活 | STREAMER ACTIVITY</title>

  <script>
    (() => {
      const saved = localStorage.getItem("stac-theme");
      document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
    })();
  </script>

  <link rel="stylesheet" href="./display.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>

<body>
  <div class="display-app">
    <header class="display-header">
      <a class="brand" href="./index.html" aria-label="スト活ホーム">
        <span class="brand-jp">スト活</span>
        <span class="brand-en">STREAMER ACTIVITY</span>
      </a>

      <div class="header-tools">
        <button id="display-theme" class="theme-button" type="button" aria-label="テーマを切り替える">
          <span class="theme-icon">◐</span>
          <span>テーマ</span>
        </button>
        <div class="display-date" id="display-date">----</div>
        <div class="display-clock" id="display-clock">--:--</div>
      </div>
    </header>

    <main class="display-main">
      <section class="display-section live-section">
        <div class="section-heading">
          <div>
            <div class="section-label">LIVE / NOW</div>
            <h1>配信中</h1>
          </div>
          <div class="section-hint live-hint">LIVE</div>
        </div>
        <div id="live-list" class="live-list">
          <div class="empty-state">
            <div class="empty-title">配信を確認中…</div>
            <div class="empty-sub">YouTubeの最新情報を読み込んでいます</div>
          </div>
        </div>
      </section>

      <section class="display-section upcoming-section">
        <div class="section-heading compact">
          <div>
            <div class="section-label">UP NEXT</div>
            <h2>配信予定</h2>
          </div>
          <div class="section-hint">SCHEDULE</div>
        </div>
        <div id="upcoming-list" class="upcoming-list">
          <div class="empty-state small">
            <div class="empty-title">読み込み中…</div>
          </div>
        </div>
      </section>

      <section class="display-section latest-section">
        <div class="section-heading compact">
          <div>
            <div class="section-label">LATEST</div>
            <h2>最新動画</h2>
          </div>
          <div class="section-hint">VIDEOS</div>
        </div>
        <div id="latest-list" class="latest-list">
          <div class="empty-state small">
            <div class="empty-title">読み込み中…</div>
          </div>
        </div>
      </section>

      <section class="display-section x-section">
        <div class="section-heading compact">
          <div>
            <div class="section-label">X / POSTS</div>
            <h2>Xの最新ポスト</h2>
          </div>
          <div class="section-hint">POSTS</div>
        </div>

        <div id="x-post-list" class="x-post-list">
          <div class="empty-state small">
            <div class="empty-title">Xのポストを表示できます</div>
            <div class="empty-sub">投稿データを接続するとここに表示されます</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="display-footer">
      <div>
        <span class="footer-dot"></span>
        STAC ONLINE
      </div>
      <div id="last-updated">最終更新 --:--</div>
      <div>自動更新 60s</div>
    </footer>
  </div>

  <div id="portrait-warning" class="portrait-warning">
    <div class="portrait-card">
      <div class="portrait-icon">↔</div>
      <strong>横向き表示がおすすめです</strong>
      <span>iPadを横向きにするとSTACを広く表示できます。</span>
    </div>
  </div>

  <script>
    const VIDEO_RETENTION_DAYS = 7;
    const LIVE_SLIDE_INTERVAL = 5000;

    let liveSlideTimer = null;
    let liveItems = [];
    let currentLiveIndex = 0;

    const $ = (selector) => document.querySelector(selector);

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatTime(value) {
      if (!value) return "--:--";
      return new Date(value).toLocaleTimeString("ja-JP", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatDate(value) {
      if (!value) return "----/--/--";
      return new Date(value).toLocaleDateString("ja-JP", {
        month: "numeric",
        day: "numeric",
        weekday: "short"
      });
    }

    function getYouTubeUrl(item) {
      if (item.url) return item.url;
      return item.video_id ? `https://www.youtube.com/watch?v=${encodeURIComponent(item.video_id)}` : "#";
    }

    function getThumbnail(item) {
      if (item.thumbnail) return item.thumbnail;
      if (item.video_id) return `https://i.ytimg.com/vi/${encodeURIComponent(item.video_id)}/hqdefault.jpg`;
      return "";
    }

    function applyTheme(theme) {
      const next = theme === "light" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("stac-theme", next);

      const button = $("#display-theme");
      if (button) {
        button.querySelector(".theme-icon").textContent = next === "light" ? "☼" : "◐";
        button.querySelector("span:last-child").textContent = next === "light" ? "ライト" : "ダーク";
      }
    }

    function initTheme() {
      applyTheme(document.documentElement.dataset.theme || "dark");
    }

    $("#display-theme")?.addEventListener("click", () => {
      const current = document.documentElement.dataset.theme;
      applyTheme(current === "dark" ? "light" : "dark");
    });

    function updateClock() {
      const now = new Date();
      $("#display-date").textContent = now.toLocaleDateString("ja-JP", {
        year: "numeric",
        month: "numeric",
        day: "numeric",
        weekday: "short"
      });
      $("#display-clock").textContent = now.toLocaleTimeString("ja-JP", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function setUpdated() {
      $("#last-updated").textContent = `最終更新 ${formatTime(new Date())}`;
    }

    function renderLive(items) {
      liveItems = items;

      if (liveSlideTimer) {
        clearInterval(liveSlideTimer);
        liveSlideTimer = null;
      }

      const container = $("#live-list");

      if (!items.length) {
        container.innerHTML = `
          <div class="empty-state live-empty">
            <div class="empty-orb"></div>
            <div class="empty-title">現在、配信はありません</div>
            <div class="empty-sub">配信が始まるとここに表示されます</div>
          </div>`;
        return;
      }

      currentLiveIndex = 0;

      const draw = () => {
        const item = liveItems[currentLiveIndex % liveItems.length];
        const thumbnail = getThumbnail(item);

        container.innerHTML = `
          <a class="live-card" href="${escapeHtml(getYouTubeUrl(item))}" target="_blank" rel="noopener noreferrer">
            <div class="live-thumbnail">
              ${thumbnail ? `<img src="${escapeHtml(thumbnail)}" alt="" loading="eager">` : ""}
              <div class="live-overlay"></div>
              <div class="live-badge"><span></span>LIVE</div>
            </div>
            <div class="live-info">
              <div class="streamer-name">${escapeHtml(item.streamer_name || item.streamer_id || "STREAMER")}</div>
              <div class="live-title">${escapeHtml(item.title || "配信中")}</div>
              <div class="live-meta">YouTube LIVE</div>
            </div>
          </a>`;
      };

      draw();

      if (items.length > 1) {
        liveSlideTimer = setInterval(() => {
          currentLiveIndex = (currentLiveIndex + 1) % liveItems.length;
          draw();
        }, LIVE_SLIDE_INTERVAL);
      }
    }

    function renderUpcoming(items) {
      const container = $("#upcoming-list");

      if (!items.length) {
        container.innerHTML = `
          <div class="empty-state small">
            <div class="empty-title">配信予定はありません</div>
            <div class="empty-sub">予定が登録されるとここに表示されます</div>
          </div>`;
        return;
      }

      container.innerHTML = items.slice(0, 6).map(item => `
        <a class="upcoming-card" href="${escapeHtml(getYouTubeUrl(item))}" target="_blank" rel="noopener noreferrer">
          <div class="upcoming-time">${formatTime(item.scheduled_at)}</div>
          <div class="upcoming-body">
            <div class="upcoming-streamer">${escapeHtml(item.streamer_name || item.streamer_id || "STREAMER")}</div>
            <div class="upcoming-title">${escapeHtml(item.title || "配信予定")}</div>
            <div class="upcoming-date">${formatDate(item.scheduled_at)}</div>
          </div>
        </a>
      `).join("");
    }

    function renderLatest(items) {
      const container = $("#latest-list");

      if (!items.length) {
        container.innerHTML = `
          <div class="empty-state small">
            <div class="empty-title">最新動画がありません</div>
          </div>`;
        return;
      }

      container.innerHTML = items.slice(0, 5).map(item => {
        const thumbnail = getThumbnail(item);
        return `
          <a class="latest-card" href="${escapeHtml(getYouTubeUrl(item))}" target="_blank" rel="noopener noreferrer">
            <div class="latest-thumb">
              ${thumbnail ? `<img src="${escapeHtml(thumbnail)}" alt="" loading="lazy">` : ""}
            </div>
            <div class="latest-body">
              <div class="latest-streamer">${escapeHtml(item.streamer_name || item.streamer_id || "STREAMER")}</div>
              <div class="latest-title">${escapeHtml(item.title || "動画")}</div>
              <div class="latest-date">${formatDate(item.published_at || item.created_at)}</div>
            </div>
          </a>`;
      }).join("");
    }

    function renderXPosts(posts = []) {
      const container = $("#x-post-list");

      if (!posts.length) {
        container.innerHTML = `
          <div class="empty-state small">
            <div class="empty-icon">𝕏</div>
            <div class="empty-title">Xのポストを表示できます</div>
            <div class="empty-sub">投稿データを接続するとここに表示されます</div>
          </div>`;
        return;
      }

      container.innerHTML = posts.slice(0, 8).map(post => `
        <a class="x-post-card" href="${escapeHtml(post.url || "#")}" target="_blank" rel="noopener noreferrer">
          <div class="x-post-head">
            <div class="x-avatar">${escapeHtml((post.name || "X").slice(0, 1))}</div>
            <div class="x-post-user">
              <strong>${escapeHtml(post.name || post.username || "STREAMER")}</strong>
              <span>${escapeHtml(post.username ? "@" + post.username : "")}</span>
            </div>
            <div class="x-post-date">${escapeHtml(post.date || "")}</div>
          </div>
          <div class="x-post-text">${escapeHtml(post.text || "")}</div>
          <div class="x-post-link">𝕏で見る ↗</div>
        </a>
      `).join("");
    }

    async function loadDisplayData() {
      const config = window.STAC_CONFIG;

      if (!config?.SUPABASE_URL || !config?.SUPABASE_PUBLISHABLE_KEY) {
        console.warn("STAC_CONFIG が見つかりません。");
        renderLive([]);
        renderUpcoming([]);
        renderLatest([]);
        renderXPosts([]);
        return;
      }

      const { createClient } = window.supabase;
      const client = createClient(
        config.SUPABASE_URL,
        config.SUPABASE_PUBLISHABLE_KEY
      );

      try {
        const [{ data: streamers, error: streamerError }, { data: videos, error: videoError }] =
          await Promise.all([
            client
              .from("streamers")
              .select("id,name,thumbnail,enabled")
              .eq("enabled", true),
            client
              .from("videos")
              .select(`
                video_id,
                streamer_id,
                streamer_name,
                status,
                title,
                description,
                published_at,
                scheduled_at,
                actual_start_at,
                duration,
                thumbnail,
                url,
                created_at,
                updated_at
              `)
          ]);

        if (streamerError) throw streamerError;
        if (videoError) throw videoError;

        const streamerMap = new Map(
          (streamers || []).map(s => [s.id, s])
        );

        const enriched = (videos || [])
          .map(video => {
            const streamer = streamerMap.get(video.streamer_id);
            return {
              ...video,
              streamer_name: video.streamer_name || streamer?.name || video.streamer_id,
              thumbnail: video.thumbnail || streamer?.thumbnail || null
            };
          });

        const now = Date.now();
        const retentionMs = VIDEO_RETENTION_DAYS * 24 * 60 * 60 * 1000;

        const live = enriched.filter(v => v.status === "live");

        const upcoming = enriched
          .filter(v => v.status === "upcoming" && v.scheduled_at)
          .filter(v => new Date(v.scheduled_at).getTime() >= now - 5 * 60 * 1000)
          .sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));

        const latest = enriched
          .filter(v => ["video", "archive"].includes(v.status))
          .filter(v => {
            const date = new Date(v.published_at || v.created_at || 0).getTime();
            return now - date <= retentionMs;
          })
          .sort((a, b) =>
            new Date(b.published_at || b.created_at) -
            new Date(a.published_at || a.created_at)
          );

        renderLive(live);
        renderUpcoming(upcoming);
        renderLatest(latest);
        renderXPosts([]);
        setUpdated();
      } catch (error) {
        console.error("STAC display load error:", error);
        renderLive([]);
        renderUpcoming([]);
        renderLatest([]);
        renderXPosts([]);
      }
    }

    initTheme();
    updateClock();
    setInterval(updateClock, 1000);
    loadDisplayData();
    setInterval(loadDisplayData, 60 * 1000);
  </script>
</body>
</html>
